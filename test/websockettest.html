<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Neapolitan Checkers - WebSocket Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            padding: 9px;
            margin: 5px 0;
            width: 250px;
            box-sizing: border-box;
        }

        button {
            padding: 9px 14px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
        }

        #status {
            font-weight: bold;
            margin: 15px 0;
        }

        #gameInfo {
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }

        #messages {
            border: 1px solid #ccc;
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }

    </style>

</head>

<body>

<h1>Neapolitan Checkers</h1>

<h2>WebSocket Test</h2>

<h3>Game</h3>

<button onclick="createGame()">
    Create Game
</button>

<br>

<input
        type="text"
        id="gameId"
        placeholder="Enter Game ID"
>

<br>

<button onclick="connect()">
    Connect
</button>

<button onclick="disconnect()">
    Disconnect
</button>

<p id="status">
    Status: Disconnected
</p>

<div id="gameInfo">

    Game: -
    <br>

    Player: -
    <br>

    Players: -
    <br>

    Status: -

</div>

<h3>Send Test Message</h3>

<input
        type="text"
        id="messageInput"
        placeholder="Enter message"
>

<button onclick="sendMessage()">
    Send
</button>

<h3>Messages</h3>

<div id="messages"></div>

<script>

    let socket = null;


    async function createGame() {

        try {

            const response =
                await fetch(
                    "http://localhost:8080/api/games",
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                addMessage(
                    "ERROR: "
                    + (data.error ||
                        "Failed to create game.")
                );

                return;
            }

            document.getElementById("gameId").value =
                data.gameId;

            addMessage(
                "Created game: "
                + data.gameId
            );

            addMessage(
                "Status: "
                + data.status
            );

        } catch (error) {

            addMessage(
                "ERROR creating game: "
                + error.message
            );
        }
    }


    function connect() {

        const gameId =
            document
                .getElementById("gameId")
                .value
                .trim()
                .toUpperCase();

        if (!gameId) {

            addMessage(
                "ERROR: Enter a Game ID first."
            );

            return;
        }

        if (socket &&
            socket.readyState === WebSocket.OPEN) {

            addMessage(
                "Already connected."
            );

            return;
        }

        addMessage(
            "Connecting to game "
            + gameId
            + "..."
        );

        socket =
            new WebSocket(
                "ws://localhost:8080/online?gameId="
                + encodeURIComponent(gameId)
            );

        updateStatus(
            "Connecting..."
        );


        socket.onopen = function () {

            updateStatus(
                "Connected"
            );

            addMessage(
                "WebSocket connection established."
            );
        };


        socket.onmessage = function (event) {

            console.log(
                "Received:",
                event.data
            );

            try {

                const data =
                    JSON.parse(event.data);

                handleMessage(data);

            } catch (error) {

                addMessage(
                    "Received non-JSON message: "
                    + event.data
                );
            }
        };


        socket.onclose = function (event) {

            updateStatus(
                "Disconnected"
            );

            addMessage(
                "WebSocket connection closed."
            );

            console.log(
                "WebSocket close:",
                event.code,
                event.reason
            );

            socket = null;
        };


        socket.onerror = function (error) {

            updateStatus(
                "Connection error"
            );

            addMessage(
                "WebSocket error occurred."
            );

            console.error(
                "WebSocket error:",
                error
            );
        };
    }


    function disconnect() {

        if (!socket) {

            addMessage(
                "Not connected."
            );

            return;
        }

        addMessage(
            "Disconnecting..."
        );

        socket.close();
    }


    function sendMessage() {

        if (!socket ||
            socket.readyState !== WebSocket.OPEN) {

            addMessage(
                "ERROR: Not connected to a game."
            );

            return;
        }

        const input =
            document.getElementById(
                "messageInput"
            );

        const message =
            input.value.trim();

        if (!message) {
            return;
        }

        socket.send(message);

        input.value = "";
    }


    function handleMessage(data) {

        addMessage(
            "["
            + data.type
            + "] "
            + (data.message || "")
        );


        if (data.gameId) {

            document.getElementById(
                "gameInfo"
            ).innerHTML =

                "Game: "
                + data.gameId

                + "<br>Player: "
                + (data.player ?? "-")

                + "<br>Players: "
                + (data.players ?? "-")

                + "<br>Status: "
                + (data.status ?? "-");
        }


        // If the server says the connection failed,
        // make sure the UI reflects that.
        if (data.type === "ERROR") {

            updateStatus(
                "Connection rejected"
            );
        }
    }


    function updateStatus(status) {

        document.getElementById(
            "status"
        ).innerText =
            "Status: " + status;
    }


    function addMessage(message) {

        const container =
            document.getElementById(
                "messages"
            );

        const entry =
            document.createElement(
                "div"
            );

        entry.className =
            "message";

        entry.innerText =
            new Date()
                .toLocaleTimeString()
            + " — "
            + message;

        container.appendChild(
            entry
        );

        container.scrollTop =
            container.scrollHeight;
    }

</script>

</body>

</html>
